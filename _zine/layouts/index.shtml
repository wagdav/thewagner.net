<extend template="base.shtml">
<head id="head"></head>
<div id="main">
	<div :loop="$site.page('blog').subpages()">
		<div class="block">
			<div class="card">
				<div class="card-content">
					<p class="title is-4">
						<a href="$loop.it.link()" :text="$loop.it.title"></a>
					</p>
					<p class="subtitle is-6">
						<time :text="$loop.it.date.format('January 02, 2006')"></time>
					</p>
					<div class="content" :text="$loop.it.description"></div>
				</div>
			</div>
		</div>
	</div>
</div>
